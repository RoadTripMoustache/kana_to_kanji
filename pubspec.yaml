name: kana_to_kanji
description: A new Flutter project.

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 0.37.10+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # Architecture
  get_it: ^8.0.3
  go_router: ^14.2.1
  stacked: ^3.4.4

  # Firebase
  firebase_auth: ^5.5.1
  firebase_core: ^3.12.1
  firebase_crashlytics: ^4.3.4

  # Widgets
  auto_size_text: ^3.0.0
  infinite_scroll_pagination: ^4.0.0
  rive: ^0.13.9
  feedback: ^3.1.0
  flutter_rtm:
    git:
      url: git@github.com:RoadTripMoustache/flutter_rtm.git
      ref: 4a2121b # switch to the tag when it will be available

  # Flutter community
  package_info_plus: ^8.0.0
  shared_preferences: ^2.5.3
  device_info_plus: ^11.3.3

  # Utils
  logger: ^2.4.0
  path: ^1.9.0
  path_provider: ^2.1.3
  http: ^1.2.2

  # Code Generators
  envied: ^1.1.1
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  upgrader: ^11.3.1

  # Other
  github: ^9.24.0
  sqflite: ^2.4.2
  image: ^4.5.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  analyzer: ^6.11.0
  flutter_lints: ^5.0.0
  freezed: ^3.0.6
  build_runner: ^2.4.11
  json_serializable: ^6.9.5
  mockito: ^5.4.2
  envied_generator: ^1.1.1
  sqflite_common_ffi: ^2.3.5

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/animations/
    - assets/images/
    - assets/images/logos/
    - assets/db/

  fonts:
    - family: MPlusRounded1c
      fonts:
        - asset: fonts/MPLUSRounded1c/MPLUSRounded1c-Thin.ttf
          weight: 100
          style: normal
        - asset: fonts/MPLUSRounded1c/MPLUSRounded1c-Light.ttf
          weight: 300
          style: normal
        - asset: fonts/MPLUSRounded1c/MPLUSRounded1c-Regular.ttf
          weight: 400
          style: normal
        - asset: fonts/MPLUSRounded1c/MPLUSRounded1c-Medium.ttf
          weight: 500
          style: normal
        - asset: fonts/MPLUSRounded1c/MPLUSRounded1c-Bold.ttf
          weight: 700
          style: normal
        - asset: fonts/MPLUSRounded1c/MPLUSRounded1c-ExtraBold.ttf
          weight: 800
          style: normal
        - asset: fonts/MPLUSRounded1c/MPLUSRounded1c-Black.ttf
          weight: 900
          style: normal